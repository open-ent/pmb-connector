name: dev-check-repository

# Contrôle de build à chaque push. L'ancienne version (conteneurs node:10-alpine +
# maven:3.8.6-jdk-8 avec `mvn clean install`) échouait systématiquement : le conteneur maven
# n'a aucun accès à GitHub Packages, or le pom dépend de fr.openent:app-parent:1.2.1 et de
# org.entcore:*:6.14.9-patched, absents du dépôt public ODE (404). En plus, `install` compile
# et joue les tests, qui exigent le jar org.entcore:tests.
# Ce workflow reprend donc les étapes de build de build-and-publish.yml, tronquées avant les
# étapes de publication (fat-mod, nexus, release).

on: [push]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build (Gulp + Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      # --- Front legacy (gulpfile.js + webpack.config.js à la racine) ---
      - name: Build front (Gulp)
        run: |
          docker run --rm --user root \
            -v "$PWD:/home/node/app" -w /home/node/app \
            opendigitaleducation/node:10-alpine \
            sh -c "npm install && node_modules/gulp/bin/gulp.js build"

      # --- Maven : accès GitHub Packages (app-parent + entcore -patched) ---
      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build fat JAR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: mvn clean package -Dmaven.test.skip=true -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=${GITHUB_REF_NAME}

      - name: Vérifie la présence du fat JAR
        run: |
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          if [ -z "${FAT_JAR}" ]; then echo "::error::Fat JAR introuvable"; ls -la target/*.jar || true; exit 1; fi
          echo "Fat JAR : ${FAT_JAR}"
